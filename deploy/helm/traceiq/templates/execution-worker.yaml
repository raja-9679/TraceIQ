{{/*
One execution-worker Deployment. Used for the main pool and for every entry in
regionWorkers (WP8), so a region worker is the same pod with WORKER_REGION set.
Params: root, component, region, exclusive, replicas, resources, scaled.
*/}}
{{- define "traceiq.executionWorkerDeployment" -}}
{{- $root := .root -}}
{{- $component := .component -}}
{{- $region := .region -}}
{{- $exclusive := .exclusive -}}
{{- $replicas := .replicas -}}
{{- $resources := .resources -}}
{{- $scaled := .scaled -}}
{{- $secret := include "traceiq.secretName" $root -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "traceiq.fullname" $root }}-{{ $component }}
  labels:
    {{- include "traceiq.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  {{- if not $scaled }}
  replicas: {{ $replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "traceiq.selectorLabels" (dict "root" $root "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "traceiq.selectorLabels" (dict "root" $root "component" $component) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "traceiq.serviceAccountName" $root }}
      automountServiceAccountToken: false
      {{- with $root.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      # Drain in-flight Playwright jobs before the pod goes; the worker acks a
      # job only when its result is posted, so anything cut off is re-claimed.
      terminationGracePeriodSeconds: 120
      containers:
        - name: execution-worker
          image: {{ include "traceiq.image" (dict "root" $root "name" "execution-worker") }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $root.Values.containerSecurityContext | nindent 12 }}
          env:
            {{- include "traceiq.secretEnv" (dict "name" "REDIS_PASSWORD" "secret" $secret "key" "REDIS_PASSWORD") | nindent 12 }}
            {{- include "traceiq.secretEnv" (dict "name" "MINIO_ACCESS_KEY" "secret" $secret "key" "MINIO_ROOT_USER") | nindent 12 }}
            {{- include "traceiq.secretEnv" (dict "name" "MINIO_SECRET_KEY" "secret" $secret "key" "MINIO_ROOT_PASSWORD") | nindent 12 }}
            {{- include "traceiq.secretEnv" (dict "name" "WEBHOOK_SECRET" "secret" $secret "key" "WEBHOOK_SECRET") | nindent 12 }}
            - name: REDIS_URL
              value: {{ printf "%s://:$(REDIS_PASSWORD)@%s:%s/0" (include "traceiq.redisScheme" $root) (include "traceiq.redisHost" $root) (include "traceiq.redisPort" $root) | quote }}
            - name: REDIS_JOBS_STREAM
              value: jobs:pending
            {{- with $region }}
            # Region-pinned runs land on jobs:pending:<region> (WP8).
            - name: WORKER_REGION
              value: {{ . | quote }}
            {{- if $exclusive }}
            - name: WORKER_REGION_EXCLUSIVE
              value: "true"
            {{- end }}
            {{- end }}
            - name: REDIS_RESULTS_STREAM
              value: jobs:results
            - name: REDIS_CONSUMER_GROUP
              value: execution-workers
            - name: MINIO_ENDPOINT
              value: {{ (splitList ":" (include "traceiq.minioEndpoint" $root)) | first | quote }}
            - name: MINIO_PORT
              value: {{ (splitList ":" (include "traceiq.minioEndpoint" $root)) | last | quote }}
            - name: MINIO_USE_SSL
              value: {{ include "traceiq.minioUseSSL" $root | quote }}
            - name: MINIO_BUCKET_NAME
              value: {{ $root.Values.minio.bucket | quote }}
            - name: BACKEND_URL
              value: http://{{ include "traceiq.fullname" $root }}-backend:{{ $root.Values.backend.service.port }}
            - name: DEFAULT_TIMEOUT
              value: {{ $root.Values.executionWorker.defaultTimeoutMs | quote }}
            - name: ARTIFACTS_DIR
              value: /tmp/artifacts
            - name: RUNTIME_HEAL_ENABLED
              value: {{ $root.Values.executionWorker.runtimeHealEnabled | quote }}
            - name: RAW_PLAYWRIGHT_ENABLED
              value: {{ $root.Values.executionWorker.rawPlaywrightEnabled | quote }}
            {{- with $root.Values.executionWorker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: artifacts
              mountPath: /tmp/artifacts
          resources:
            {{- toYaml $resources | nindent 12 }}
      volumes:
        # Chromium crashes with the default 64Mi /dev/shm; compose sets shm_size.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ $root.Values.executionWorker.shmSize }}
        - name: artifacts
          emptyDir: {}
      {{- with $root.Values.executionWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.executionWorker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.executionWorker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}

{{- $kedaOn := and .Values.keda .Values.keda.enabled -}}
{{- include "traceiq.executionWorkerDeployment" (dict "root" . "component" "execution-worker" "region" .Values.executionWorker.region "exclusive" .Values.executionWorker.regionExclusive "replicas" .Values.executionWorker.replicas "resources" .Values.executionWorker.resources "scaled" (or .Values.executionWorker.autoscaling.enabled $kedaOn)) }}
{{- range .Values.regionWorkers }}
---
{{ include "traceiq.executionWorkerDeployment" (dict "root" $ "component" (printf "execution-worker-%s" .name) "region" (required "regionWorkers[].region is required" .region) "exclusive" (default false .exclusive) "replicas" (default 1 .replicas) "resources" (default $.Values.executionWorker.resources .resources) "scaled" $kedaOn) }}
{{- end }}
{{- /* KEDA owns worker scaling when enabled; two autoscalers on one
Deployment fight each other, so the CPU HPA is suppressed. */}}
{{- if and .Values.executionWorker.autoscaling.enabled (not $kedaOn) }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "traceiq.fullname" . }}-execution-worker
  labels:
    {{- include "traceiq.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "traceiq.fullname" . }}-execution-worker
  minReplicas: {{ .Values.executionWorker.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.executionWorker.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.executionWorker.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
