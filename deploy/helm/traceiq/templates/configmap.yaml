apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "traceiq.fullname" . }}-config
  labels:
    {{- include "traceiq.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  FRONTEND_BASE_URL: {{ .Values.config.frontendBaseUrl | quote }}
  BACKEND_CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  MINIO_ENDPOINT: {{ include "traceiq.minioEndpoint" . | quote }}
  MINIO_USE_SSL: {{ include "traceiq.minioUseSSL" . | quote }}
  MINIO_BUCKET_NAME: {{ .Values.minio.bucket | quote }}
  MINIO_PUBLIC_URL: {{ .Values.config.minioPublicUrl | quote }}
  {{- if and (not .Values.minio.enabled) .Values.minio.external.sseAlgorithm }}
  MINIO_SSE_ALGORITHM: {{ .Values.minio.external.sseAlgorithm | quote }}
  {{- end }}
  MAX_CAPTURE_LEVEL: {{ .Values.config.maxCaptureLevel | quote }}
  RUN_RETENTION_DAYS: {{ .Values.config.runRetentionDays | quote }}
  AUDIT_RETENTION_DAYS: {{ .Values.config.auditRetentionDays | quote }}
  REQUIRE_TRANSPORT_SECURITY: {{ .Values.config.requireTransportSecurity | quote }}
  ALLOW_PRIVATE_NETWORK_TARGETS: {{ .Values.config.allowPrivateNetworkTargets | quote }}
  OUTBOUND_ALLOWED_HOSTS: {{ .Values.config.outboundAllowedHosts | quote }}
  LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  {{- if .Values.config.otelExporterOtlpEndpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelExporterOtlpEndpoint | quote }}
  OTEL_TRACES_SAMPLER: {{ .Values.config.otelTracesSampler | quote }}
  OTEL_TRACES_SAMPLER_ARG: {{ .Values.config.otelTracesSamplerArg | quote }}
  {{- end }}
  {{- if .Values.config.adminEmail }}
  ADMIN_EMAIL: {{ .Values.config.adminEmail | quote }}
  ADMIN_FULL_NAME: {{ .Values.config.adminFullName | quote }}
  {{- end }}
  {{- range $k, $v := .Values.config.extra }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
