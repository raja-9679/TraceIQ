{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "traceiq.secretName" . }}
  labels:
    {{- include "traceiq.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ required "secrets.secretKey is required (openssl rand -hex 32) — or set secrets.existingSecret" .Values.secrets.secretKey | quote }}
  WEBHOOK_SECRET: {{ required "secrets.webhookSecret is required (openssl rand -hex 32)" .Values.secrets.webhookSecret | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required (openssl rand -hex 24)" .Values.secrets.postgresPassword | quote }}
  REDIS_PASSWORD: {{ required "secrets.redisPassword is required (openssl rand -hex 24)" .Values.secrets.redisPassword | quote }}
  MINIO_ROOT_USER: {{ required "secrets.minioRootUser is required (not minioadmin)" .Values.secrets.minioRootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ required "secrets.minioRootPassword is required (openssl rand -hex 24)" .Values.secrets.minioRootPassword | quote }}
  {{- if eq .Values.secrets.secretKey .Values.secrets.webhookSecret }}
  {{- fail "secrets.webhookSecret must differ from secrets.secretKey" }}
  {{- end }}
  {{- if eq .Values.secrets.minioRootUser "minioadmin" }}
  {{- fail "secrets.minioRootUser must not be minioadmin" }}
  {{- end }}
  {{- with .Values.secrets.secretsKey }}
  SECRETS_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.secretsKeyPrevious }}
  SECRETS_KEY_PREVIOUS: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.metricsToken }}
  METRICS_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.sentryDsn }}
  SENTRY_DSN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.otelExporterOtlpHeaders }}
  OTEL_EXPORTER_OTLP_HEADERS: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.adminPassword }}
  ADMIN_PASSWORD: {{ . | quote }}
  {{- end }}
{{- end }}
