# Shipped into the image as /etc/nginx/templates/default.conf.template: the
# nginx image's entrypoint runs envsubst over it at CONTAINER START, so
# ${BACKEND_URL} below is substituted from the environment (default set in the
# Dockerfile) — the backend location is runtime configuration, not baked in.
# nginx's own runtime variables ($host, $http_upgrade, ...) are untouched
# because envsubst only replaces variables that exist in the environment.

# Sends "Connection: upgrade" only for actual WebSocket handshakes and
# "Connection: close" otherwise. This file is included from nginx's http block
# (conf.d/*.conf), so a map here is in the right context.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # Don't leak the nginx version in Server: headers and error pages.
    server_tokens off;

    # Baseline security headers, `always` so they are sent on error responses
    # too. NOTE: add_header in a location REPLACES (does not merge) inherited
    # add_header directives, so any location that sets its own add_header below
    # must re-state these four.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Uploaded app builds (mobile .apk/.ipa) can be large, and the default 1m
    # would reject them at the proxy before the API's own limit applies.
    client_max_body_size 100m;

    # The prebuilt frontend image can't know its deployment URL (Vite inlines
    # env vars at build time), so the app calls a same-origin relative /api and
    # this proxies it to the backend. That also means no CORS preflight.
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # index.html must not be cached, or browsers keep loading an old bundle
        # after an upgrade. The hashed assets under /assets/ are immutable.
        # This add_header drops the server-level security headers, so re-state.
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        # Re-state security headers: this add_header drops the inherited ones.
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Live run updates use a WebSocket under /api/ws/. Without the Upgrade
    # headers below nginx answers the handshake with a plain 200 and the socket
    # never opens, so run pages silently stop updating.
    location /api/ {
        # proxy_pass through a VARIABLE so nginx resolves the backend hostname
        # per request (honoring `valid=`) instead of once at startup — a
        # recreated backend container gets a new IP, and the static form kept
        # proxying to the dead one (502 until the frontend was restarted).
        # 127.0.0.11 is Docker's embedded DNS; override NGINX_RESOLVER when
        # running outside Docker networking. Note: with the variable form,
        # BACKEND_URL must stay a bare origin (no path) — the original request
        # URI is passed through unchanged.
        resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
        set $backend_upstream ${BACKEND_URL};
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Test runs stream progress for as long as they execute; the 60s default
        # would drop the connection mid-run.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
