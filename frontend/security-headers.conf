# Security headers, included wherever add_header is used (nginx add_header in a
# location REPLACES the inherited set, so every site must restate them all).
#
# CSP: the app is a Vite bundle with no inline scripts, so script-src 'self' is
# the real XSS mitigation here. Styles need 'unsafe-inline' (Tailwind/shadcn
# inject style attributes) and Google Fonts. Images, media and fetches are open
# to any http(s) origin because test artifacts (screenshots, videos, traces)
# are served from the object store's public URL, which differs per deployment
# and is only known at runtime — the trade-off is deliberate: it blocks script
# injection without breaking artifact viewing. Tighten img/media/connect-src
# to your MINIO_PUBLIC_URL host in a deployment-specific override if you can.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; media-src 'self' blob: https: http:; connect-src 'self' https: http: wss: ws:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
# No OAuth/SAML popups: sign-in is a full-page redirect, so the strict value is safe.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# COEP is deliberately NOT set: require-corp would block artifact images from
# the object store unless that server sent CORP headers too.
