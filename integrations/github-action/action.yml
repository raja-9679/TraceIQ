name: 'TraceIQ Regression Run'
description: 'Run TraceIQ regression tests against a code change and gate the PR on the result.'
author: 'TraceIQ'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  base-url:
    description: 'TraceIQ base URL, e.g. https://traceiq.example.com'
    required: true
  api-key:
    description: 'TraceIQ workspace API key (tiq_...). Use a repo secret.'
    required: true
  suite-id:
    description: 'TraceIQ test suite ID to run.'
    required: true
  case-id:
    description: 'Optional. Run only this test case.'
    required: false
  project-id:
    description: >-
      Optional TraceIQ project ID. When set (and running on a pull request
      with a github-token), the action runs impact analysis on the PR's
      changed files and reports which test cases the diff touches — and why —
      in the PR comment.
    required: false
  github-token:
    description: >-
      Token used to read the PR diff (for impact analysis) and post/update
      the summary comment. Defaults to the workflow token.
    required: false
    default: ${{ github.token }}
  browser:
    description: 'Comma-separated browsers (default: chromium).'
    required: false
    default: 'chromium'
  agent-id:
    description: 'Identifier for the agent/system triggering the run. Defaults to "github-action".'
    required: false
    default: 'github-action'
  triggered-by:
    description: 'One of human|schedule|api_agent|ci|webhook. Defaults to "ci".'
    required: false
    default: 'ci'
  poll-interval-seconds:
    description: 'How often to poll for run completion.'
    required: false
    default: '10'
  timeout-seconds:
    description: 'Maximum time to wait for the run to finish.'
    required: false
    default: '1800'
  fail-on:
    description: >-
      Quality gate. "failures" (default) fails the step when any run ends in
      failed/error or times out; "none" never fails the step (report-only).
    required: false
    default: 'failures'
  post-pr-comment:
    description: >-
      Post (or update) a summary comment on the triggering PR. Requires a
      github-token with pull-requests: write. The comment is idempotent — a
      hidden marker lets the action update its previous comment on re-runs.
    required: false
    default: 'true'

outputs:
  run-id:
    description: 'TraceIQ run ID(s) that were created.'
  status:
    description: 'Final status of the run.'
  passed:
    description: 'Number of passed test cases.'
  failed:
    description: 'Number of failed test cases.'
  gate-passed:
    description: 'Whether the server-side quality gate passed (only set when project-id is provided).'

runs:
  using: 'node20'
  main: 'dist/index.js'
