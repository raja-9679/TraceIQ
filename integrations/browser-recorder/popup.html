<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>TraceIQ Recorder</title>
    <link rel="stylesheet" href="page.css" />
    <style>body { width: 320px; }</style>
</head>
<body>
    <h1>TraceIQ Recorder</h1>
    <p id="status" role="status"></p>

    <div id="recording" class="row" hidden>
        <button id="finish" class="primary" type="button">Finish</button>
        <button id="cancel" type="button">Discard recording</button>
    </div>

    <div id="pending" hidden>
        <p class="muted">Open a test in TraceIQ and press Record to add them, or copy them.</p>
        <div class="row"><button id="copy" type="button">Copy steps as JSON</button></div>
    </div>

    <h2>Sites allowed to record</h2>
    <p id="none" class="muted">None yet. You are asked the first time a site starts a recording.</p>
    <ul id="trusted"></ul>

    <p id="version" class="muted" style="margin-top:14px"></p>
    <script src="popup.js"></script>
</body>
</html>
