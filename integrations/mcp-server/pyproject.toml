[project]
name = "traceiq-mcp-server"
version = "0.2.0"
description = "Model Context Protocol server exposing TraceIQ as typed tools for AI coding agents (Claude Code, Cursor, etc.)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "testing", "playwright", "test-automation", "ai-agents", "traceiq"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    # >=1.10: structured tool output (outputSchema / structuredContent).
    "mcp>=1.10,<2",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "starlette>=0.37.0",
    "uvicorn>=0.29.0",
    "anyio>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/raja-9679/TraceIQ"
Documentation = "https://github.com/raja-9679/TraceIQ/blob/main/integrations/mcp-server/README.md"

[project.scripts]
traceiq-mcp      = "traceiq_mcp.server:main"
traceiq-mcp-http = "traceiq_mcp.server_http:main_http"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Publishing (maintainers):
#   python -m pip install build twine
#   python -m build
#   python -m twine upload dist/*        # needs a PyPI API token
# After publishing, agents install with:  pip install traceiq-mcp-server
