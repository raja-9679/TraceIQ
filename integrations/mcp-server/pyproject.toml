[project]
name = "traceiq-mcp-server"
version = "0.1.0"
description = "Model Context Protocol server exposing TraceIQ as a tool for AI coding agents (Claude Code, Cursor, etc.)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "fastapi>=0.111.0",
    "starlette>=0.37.0",
    "uvicorn>=0.29.0",
    "anyio>=4.0.0",
]

[project.scripts]
traceiq-mcp      = "traceiq_mcp.server:main"
traceiq-mcp-http = "traceiq_mcp.server_http:main_http"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
