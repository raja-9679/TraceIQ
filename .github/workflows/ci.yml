name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      # The whole unit suite. tests/e2e and tests/integration need a live stack
      # (Postgres, Redis, MinIO, workers) and are excluded deliberately, as are
      # the tests/verify_*.py files, which are ad-hoc manual scripts rather than
      # pytest modules — converting those is tracked in
      # info/REGULATED_READINESS.md (workstream I).
      #
      # This used to run two files out of the suite. Everything else was written
      # and then never executed by CI, which is how tests/test_stale_run_detection.py
      # and friends could have rotted unnoticed.
      - name: Run unit tests
        working-directory: backend
        run: |
          python -m pytest tests/ \
            --ignore=tests/e2e \
            --ignore=tests/integration \
            --ignore-glob='tests/verify_*.py' \
            -v --tb=short

  engine-tests:
    # The redaction module is the worker's only defence against writing
    # credentials and PII into MinIO artifacts. It must be exercised on every
    # change, not just when someone remembers to run it locally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: execution-engine/package-lock.json

      - working-directory: execution-engine
        run: npm ci

      - working-directory: execution-engine
        run: npm test

      # tsc must stay clean, and must not emit the .test.ts files into dist/.
      - working-directory: execution-engine
        run: npm run build

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - working-directory: frontend
        run: npm ci

      # tsc -b is part of `npm run build`, so this type-checks as well as builds.
      - working-directory: frontend
        run: npm run build

      - working-directory: frontend
        run: npm run lint
        continue-on-error: true  # advisory until the existing backlog is cleared

  config-guards:
    # These assert the security posture of the shipped artifacts. If one of them
    # fails, a default secret or an unvalidated fetch has crept back in.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Community compose must refuse to run without secrets
        working-directory: infrastructure
        run: |
          if docker compose -f docker-compose.community.yml config >/dev/null 2>&1; then
            echo "::error::compose rendered with no secrets set — a default has crept back in"
            exit 1
          fi
          echo "OK: refused without secrets."

      - name: Community compose must render once secrets exist
        working-directory: infrastructure
        run: |
          ./traceiq-setup.sh
          docker compose -f docker-compose.community.yml --env-file .env config >/dev/null
          echo "OK: renders with generated secrets."

      - name: No TLS verification disabled anywhere in the backend
        run: |
          if grep -rn --include='*.py' -E 'verify\s*=\s*False' backend/app/; then
            echo "::error::TLS verification is disabled somewhere in backend/app"
            exit 1
          fi
          echo "OK: no disabled TLS verification."

      - name: nginx config must be valid
        run: |
          docker run --rm -v "$PWD/frontend/nginx.conf":/etc/nginx/conf.d/default.conf:ro \
            nginx:alpine sh -c "echo '127.0.0.1 backend' >> /etc/hosts && nginx -t"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs history to scan past commits

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Known finding: committed .env history and dump.sql predate this
        # workflow. Advisory until that history is rewritten, then flip to
        # blocking so nothing new lands.
        continue-on-error: true

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
