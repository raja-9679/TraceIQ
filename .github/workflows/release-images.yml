name: Publish container images

# Builds and pushes the images that self-hosted users pull via
# infrastructure/docker-compose.community.yml.
#
# Tag a release to publish an immutable version:
#   git tag v0.1.0 && git push origin v0.1.0
# That produces :0.1.0, :0.1, and :latest. Pushes to main publish :edge only, so
# `latest` never moves without a deliberate tag.

# Automatic triggers are switched off (owner's request, 2026-10-14): images
# are published only when started by hand ("Run workflow"). To turn tag and
# main-branch publishing back on, restore under `on:`:
#   push:
#     tags: ["v*.*.*"]
#     branches: [main]
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish (e.g. rc1)"
        required: false
        type: string

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless cosign: the job's GitHub OIDC token is exchanged with Fulcio
      # for a short-lived certificate naming this workflow. No signing key
      # exists anywhere to leak or rotate.
      id-token: write
    env:
      # Docker Hub publishing is optional: it activates only when both
      # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repo secrets exist. Forks and
      # secretless runs still publish to GHCR alone.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - name: execution-worker
            context: ./execution-engine
            dockerfile: ./execution-engine/Dockerfile.worker
          # All-in-one demo tier: single `docker run`, secrets generated on
          # first boot. Context is the repo root — the root .dockerignore is
          # deny-by-default and is what keeps .git/dump.sql out of this build.
          - name: aio
            context: .
            dockerfile: ./infrastructure/aio/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          # The `|| 'unset'` keeps the disabled Docker Hub entry syntactically
          # valid when the secret is absent; `enable` drops it from the output.
          images: |
            name=${{ env.REGISTRY }}/${{ github.repository_owner }}/traceiq-${{ matrix.name }}
            name=docker.io/${{ env.DOCKERHUB_USERNAME || 'unset' }}/traceiq-${{ matrix.name }},enable=${{ env.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Workers report it in their fleet heartbeat (TRACEIQ_GIT_SHA);
          # images that do not declare the ARG ignore it.
          build-args: |
            GIT_SHA=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # ---- Supply chain: signature + CycloneDX SBOM attestation ----------
      # Everything below works on the pushed DIGEST, never a tag: a tag can be
      # moved after signing, a digest cannot. Every repository the image was
      # pushed to (GHCR, plus Docker Hub when enabled) gets its own signature
      # and attestation, because cosign stores them next to the image.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Image references by digest
        id: refs
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # One line per tag in; one `repo@digest` per distinct repo out.
          refs="$(printf '%s\n' "$TAGS" | sed -e '/^$/d' -e 's/:[^:/]*$//' | sort -u | sed "s|\$|@${DIGEST}|")"
          echo "$refs"
          {
            echo "refs<<EOF"
            echo "$refs"
            echo "EOF"
            echo "primary=$(printf '%s\n' "$refs" | grep "^${REGISTRY}/" | head -n1)"
          } >> "$GITHUB_OUTPUT"

      - name: Sign (cosign keyless)
        env:
          REFS: ${{ steps.refs.outputs.refs }}
        run: |
          set -euo pipefail
          while read -r ref; do
            [ -n "$ref" ] || continue
            cosign sign --yes "$ref"
          done <<< "$REFS"

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.refs.outputs.primary }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.name }}.cdx.json
          artifact-name: sbom-${{ matrix.name }}.cdx.json
          upload-artifact: true

      - name: Attest SBOM (cosign attest)
        env:
          REFS: ${{ steps.refs.outputs.refs }}
        run: |
          set -euo pipefail
          while read -r ref; do
            [ -n "$ref" ] || continue
            cosign attest --yes --type cyclonedx \
              --predicate "sbom-${{ matrix.name }}.cdx.json" "$ref"
          done <<< "$REFS"

  # Scan what was actually published rather than a local build, so the report
  # matches the artifact users pull. Non-blocking on main, enforced on tags.
  scan:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: backend, blocking: true}
          - {name: frontend, blocking: true}
          - {name: execution-worker, blocking: true}
          # The AIO demo tier bundles postgres/redis/nginx, so it inherits
          # their distro CVEs; those shouldn't be able to block a release of
          # the production images. Scanned, reported, never enforced.
          - {name: aio, blocking: false}
    steps:
      - name: Resolve tag
        id: t
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=edge" >> "$GITHUB_OUTPUT"
          fi

      # The 0.28.0 tag this used to name no longer exists upstream (the
      # trivy-action tags were rewritten in 2026), which is exactly why every
      # action here is pinned to a commit rather than a tag.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/traceiq-${{ matrix.name }}:${{ steps.t.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.blocking && '1' || '0' }}

  verify-compose:
    # Proves the shipped compose file is loadable and, crucially, that it still
    # refuses to start without secrets. A regression there would silently ship
    # insecure defaults to every self-hoster.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compose must REFUSE with no secrets
        working-directory: infrastructure
        run: |
          if docker compose -f docker-compose.community.yml config >/dev/null 2>&1; then
            echo "::error::community compose rendered without any secrets set — a default secret has crept back in"
            exit 1
          fi
          echo "Correctly refused to render without secrets."

      - name: Compose must render with generated secrets
        working-directory: infrastructure
        run: |
          ./traceiq-setup.sh
          docker compose -f docker-compose.community.yml --env-file .env config >/dev/null
          echo "Rendered successfully."

      - name: Secrets must be distinct
        working-directory: infrastructure
        run: |
          # shellcheck disable=SC1091
          set -a; . ./.env; set +a
          if [ "$SECRET_KEY" = "$WEBHOOK_SECRET" ]; then
            echo "::error::setup script generated identical SECRET_KEY and WEBHOOK_SECRET"
            exit 1
          fi
          for v in SECRET_KEY WEBHOOK_SECRET POSTGRES_PASSWORD REDIS_PASSWORD MINIO_ROOT_PASSWORD; do
            eval "val=\$$v"
            if [ -z "$val" ]; then echo "::error::$v is empty"; exit 1; fi
            if [ "${#val}" -lt 32 ]; then echo "::error::$v is shorter than 32 chars"; exit 1; fi
          done
          echo "All generated secrets are present, long enough, and distinct."

      - name: User-supplied secrets must win over generation
        working-directory: infrastructure
        run: |
          custom="$(openssl rand -hex 24)"
          POSTGRES_PASSWORD="$custom" ./traceiq-setup.sh --force >/dev/null
          if ! grep -q "^POSTGRES_PASSWORD=${custom}$" .env; then
            echo "::error::setup script ignored a user-supplied POSTGRES_PASSWORD"
            exit 1
          fi
          # And invalid user input must be rejected, not written.
          if SECRET_KEY="too-short" ./traceiq-setup.sh --force >/dev/null 2>&1; then
            echo "::error::setup script accepted a 9-char SECRET_KEY"
            exit 1
          fi
          echo "Override precedence and validation hold."
