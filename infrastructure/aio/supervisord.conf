; Process supervision for the TraceIQ all-in-one image.
;
; Priorities: infrastructure (10) -> backend (20) -> consumers (30) -> nginx (40).
; Supervisord starts everything regardless; real ordering comes from the
; programs themselves — the backend entrypoint waits for postgres, and every
; priority-30 program is wrapped with --wait-for-backend.
;
; All logs go to the container's stdout so `docker logs traceiq` shows the
; whole stack, prefixed per program by supervisord.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:postgres]
command=/usr/lib/postgresql/15/bin/postgres -D /data/postgres -c listen_addresses=127.0.0.1
user=postgres
priority=10
autorestart=true
stopsignal=INT
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
command=/usr/bin/redis-server /run/traceiq/redis.conf
user=redis
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:minio]
command=/opt/traceiq/bin/run-service.sh /run/traceiq/backend.env /usr/local/bin/minio server /data/minio --address :9000 --console-address 127.0.0.1:9001
user=traceiq
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; The backend image's own entrypoint runs here unchanged: it waits for the
; database, applies the schema (bootstrap_db.py), then execs uvicorn.
[program:backend]
command=/opt/traceiq/bin/run-service.sh /run/traceiq/backend.env /opt/traceiq/backend/docker-entrypoint.sh uvicorn app.main:app --host 127.0.0.1 --port 8000
directory=/opt/traceiq/backend
user=traceiq
priority=20
autorestart=true
startsecs=5
startretries=20
environment=RUN_MIGRATIONS="true"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:celery-worker]
command=/opt/traceiq/bin/run-service.sh --wait-for-backend /run/traceiq/backend.env celery -A app.core.celery_app worker --loglevel=info -Q main-queue -c %(ENV_CELERY_CONCURRENCY)s
directory=/opt/traceiq/backend
user=traceiq
priority=30
autorestart=true
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:celery-aggregator]
command=/opt/traceiq/bin/run-service.sh --wait-for-backend /run/traceiq/backend.env celery -A app.core.celery_app worker --loglevel=info -Q aggregator-queue -c 2
directory=/opt/traceiq/backend
user=traceiq
priority=30
autorestart=true
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; REQUIRED: beat drains jobs:results every 2s — without it, runs execute but
; never leave RUNNING.
[program:celery-beat]
command=/opt/traceiq/bin/run-service.sh --wait-for-backend /run/traceiq/backend.env celery -A app.core.celery_app beat --loglevel=info -s /run/traceiq/beat/schedule
directory=/opt/traceiq/backend
user=traceiq
priority=30
autorestart=true
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:execution-worker]
command=/opt/traceiq/bin/run-service.sh --wait-for-backend /run/traceiq/worker.env node dist/worker.js
directory=/opt/traceiq/engine
user=traceiq
priority=30
autorestart=true
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=40
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
