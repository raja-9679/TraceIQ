# nginx config for the all-in-one image. Same shape as frontend/nginx.conf,
# but listening on 8080 and proxying to the co-located backend on loopback.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;

    # Mobile app builds (.apk/.ipa) are large; the default 1m would reject
    # them at the proxy before the API's own limit applies.
    client_max_body_size 100m;

    location / {
        root /opt/traceiq/frontend;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # index.html must not be cached, or browsers keep loading an old
        # bundle after an upgrade. The hashed assets under /assets/ are
        # immutable.
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }

    location /assets/ {
        root /opt/traceiq/frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Live run updates use a WebSocket under /api/ws/ — the Upgrade headers
    # are required or run pages silently stop updating.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Test runs stream progress for as long as they execute.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
