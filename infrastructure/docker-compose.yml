version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: quality_intelligence
    # Host port 5433 -> container 5432 (host 5432 is taken by a native Postgres).
    # Connect DBeaver/psql from the host at localhost:5433.
    # Other containers still reach it on qip_network as `postgres:5432`.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - qip_network

  redis:
    image: redis:7-alpine
    # No host port mapping — Redis is reached only by other containers on
    # qip_network as `redis:6379`. To debug from the host, run:
    #   docker exec -it infrastructure-redis-1 redis-cli
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - qip_network

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - qip_network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # Lets containers reach a host-run Ollama at host.docker.internal:11434 (Linux)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../backend:/app
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/quality_intelligence
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # LLM provider selection (anthropic | openai | gemini | ollama | openai-compatible)
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - ALGORITHM=${ALGORITHM:-HS256}
      - USE_DISTRIBUTED_EXECUTION=true
      # Notification Settings
      - NOTIFICATIONS_ENABLED=${NOTIFICATIONS_ENABLED:-false}
      - EMAIL_NOTIFICATIONS_ENABLED=${EMAIL_NOTIFICATIONS_ENABLED:-false}
      - SLACK_NOTIFICATIONS_ENABLED=${SLACK_NOTIFICATIONS_ENABLED:-false}
      - TEAMS_NOTIFICATIONS_ENABLED=${TEAMS_NOTIFICATIONS_ENABLED:-false}
      - NOTIFY_ON_FAILURE_ONLY=${NOTIFY_ON_FAILURE_ONLY:-true}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@traceiq.io}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL:-}
      # Security scanning (see celery_worker for details).
      - PASSIVE_SECURITY_SCAN_ENABLED=${PASSIVE_SECURITY_SCAN_ENABLED:-true}
      - ZAP_API_URL=${ZAP_API_URL:-}
      - ZAP_API_KEY=${ZAP_API_KEY:-}
      - SECURITY_ACTIVE_SCAN_ENABLED=${SECURITY_ACTIVE_SCAN_ENABLED:-false}
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - qip_network

  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A app.core.celery_app worker --loglevel=info -Q main-queue -c 4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/quality_intelligence
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # LLM provider selection (anthropic | openai | gemini | ollama | openai-compatible)
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - USE_DISTRIBUTED_EXECUTION=true
      # Notification Settings (Celery worker sends notifications)
      - NOTIFICATIONS_ENABLED=${NOTIFICATIONS_ENABLED:-false}
      - EMAIL_NOTIFICATIONS_ENABLED=${EMAIL_NOTIFICATIONS_ENABLED:-false}
      - SLACK_NOTIFICATIONS_ENABLED=${SLACK_NOTIFICATIONS_ENABLED:-false}
      - TEAMS_NOTIFICATIONS_ENABLED=${TEAMS_NOTIFICATIONS_ENABLED:-false}
      - NOTIFY_ON_FAILURE_ONLY=${NOTIFY_ON_FAILURE_ONLY:-true}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@traceiq.io}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL:-}
      # Security scanning. ZAP_API_URL empty → active scans are refused (safe
      # default). Point it at the `zap` service (--profile security) to enable.
      - PASSIVE_SECURITY_SCAN_ENABLED=${PASSIVE_SECURITY_SCAN_ENABLED:-true}
      - ZAP_API_URL=${ZAP_API_URL:-}
      - ZAP_API_KEY=${ZAP_API_KEY:-}
      - SECURITY_ACTIVE_SCAN_ENABLED=${SECURITY_ACTIVE_SCAN_ENABLED:-false}
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - qip_network

  # Result aggregator for distributed execution
  celery_aggregator:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A app.core.celery_app worker --loglevel=info -Q aggregator-queue -c 2
    volumes:
      - ../backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/quality_intelligence
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - SECRET_KEY=${SECRET_KEY}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
    depends_on:
      - postgres
      - redis
    networks:
      - qip_network

  celery_beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A app.core.celery_app beat --loglevel=info
    volumes:
      - ../backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/quality_intelligence
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # LLM provider selection (anthropic | openai | gemini | ollama | openai-compatible)
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - qip_network

  # ==========================================================================
  # Execution Workers (NEW - Distributed Architecture)
  # ==========================================================================
  # Scale with: docker compose --env-file env.local up -d --scale execution-worker=5
  execution-worker:
    build:
      context: ../execution-engine
      dockerfile: Dockerfile.worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_JOBS_STREAM=jobs:pending
      - REDIS_RESULTS_STREAM=jobs:results
      - REDIS_CONSUMER_GROUP=execution-workers
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET_NAME=test-artifacts
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # LLM provider selection (anthropic | openai | gemini | ollama | openai-compatible)
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - DEFAULT_TIMEOUT=${DEFAULT_TIMEOUT:-30000}
      - WORKER_IDLE_TIMEOUT=300000
      - MAX_JOBS_BEFORE_RESTART=50
      - ARTIFACTS_DIR=/tmp/artifacts
      - BACKEND_URL=http://backend:8000
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      # Runtime self-heal: auto-retry a failing step with an LLM-healed selector
      # when it uniquely matches (needs an LLM provider configured above).
      - RUNTIME_HEAL_ENABLED=${RUNTIME_HEAL_ENABLED:-false}
      # Raw Playwright executor (item 5): run uploaded specs verbatim. Arbitrary
      # code execution — only enable on a sandboxed worker.
      - RAW_PLAYWRIGHT_ENABLED=${RAW_PLAYWRIGHT_ENABLED:-false}
    depends_on:
      - redis
      - minio
    networks:
      - qip_network
    shm_size: '1gb'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      replicas: 4

  # ---------------------------------------------------------------------
  # Mobile app testing (Phase MOB) — opt-in via the "mobile" profile:
  #   docker compose --profile mobile -f docker-compose.yml up -d
  # The mobile-worker claims mobile_appium jobs from jobs:mobile:pending and
  # drives the Appium server. Appium itself needs a device to talk to: attach
  # an Android emulator container (e.g. budtmo/docker-android, requires KVM)
  # or point APPIUM_URL at a device cloud / a host-side Appium with a real
  # device plugged in. iOS requires macOS — use a device cloud.
  # ---------------------------------------------------------------------
  appium:
    image: appium/appium:latest
    profiles: ["mobile"]
    networks:
      - qip_network
    ports:
      - "4723:4723"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mobile-worker:
    build:
      context: ../execution-engine
      dockerfile: Dockerfile.worker
    command: node dist/mobile-worker.js
    profiles: ["mobile"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_JOBS_STREAM=jobs:mobile:pending
      - REDIS_RESULTS_STREAM=jobs:results
      - REDIS_CONSUMER_GROUP=mobile-workers
      - APPIUM_URL=http://appium:4723
      - DEVICE_NAME=${MOBILE_DEVICE_NAME:-Android Emulator}
    depends_on:
      - redis
      - appium
    networks:
      - qip_network

  # Legacy execution engine (for CONTINUOUS mode - shared browser context)
  execution-engine:
    build:
      context: ../execution-engine
      dockerfile: Dockerfile
    command: npm run dev
    volumes:
      - ../execution-engine:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # LLM provider selection (anthropic | openai | gemini | ollama | openai-compatible)
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_WEBHOOK_QUEUE=webhook:results
      - DEFAULT_TIMEOUT=${DEFAULT_TIMEOUT:-60000}
      - MAX_CONCURRENT_RUNS=3
      - BACKEND_URL=http://backend:8000
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
    depends_on:
      - minio
      - redis
    networks:
      - qip_network
    shm_size: '2gb'
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mcp-server:
    build:
      context: ../integrations/mcp-server
      dockerfile: Dockerfile
    ports:
      - "8088:8088"
    environment:
      # Points to the backend container — no API key here, each client passes their own
      TRACEIQ_BASE_URL: http://backend:8000
      MCP_HTTP_PORT: "8088"
      LOG_LEVEL: info
    depends_on:
      - backend
    networks:
      - qip_network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8014:80"
    depends_on:
      - postgres
    networks:
      - qip_network

  # OWASP ZAP daemon for active/authenticated DAST (PLATFORM_VISION.md P-4).
  # Optional + heavy: gated behind the `security` compose profile so a normal
  # `up` does not start it. Enable with:
  #   docker compose --profile security up -d zap
  # then set ZAP_API_URL=http://zap:8090 (and a ZAP_API_KEY) in the env so the
  # celery worker can reach it.
  zap:
    image: zaproxy/zap-stable
    profiles: ["security"]
    command: >-
      zap.sh -daemon -host 0.0.0.0 -port 8090
      -config api.disablekey=false
      -config api.key=${ZAP_API_KEY:-changeme}
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    # No host port published — the worker/backend reach ZAP internally via
    # zap:8090 on qip_network. (Publishing a host port clashes with other local
    # projects; add `ports: ["8091:8090"]` if you want host access for debugging.)
    expose:
      - "8090"
    networks:
      - qip_network

networks:
  qip_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
