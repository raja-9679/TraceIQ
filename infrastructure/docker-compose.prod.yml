# ============================================================================
# TraceIQ - Production Deployment Architecture
# ============================================================================
# This docker-compose is optimized for PRODUCTION environments:
# - No local code volume mounts (relies on pre-built images or build contexts)
# - Secure database and caching (no exposed internal ports)
# - Includes the Frontend production build (served by nginx typically)
# - No pgAdmin (use secure tunneling to connect to staging DBs if needed)
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   Scale workers: docker compose -f docker-compose.prod.yml up -d --scale execution-worker=5
#
# IMPORTANT: Provide a .env file with secure passwords and keys!
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # Infrastructure Services (Internal only)
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - qip_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - qip_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      # Expose MinIO API so frontend can download presigned artifact URLs
      - "9000:9000"
    volumes:
      - minio_data:/data
    networks:
      - qip_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  # --------------------------------------------------------------------------
  # Backend API
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-["*"]}
      - USE_DISTRIBUTED_EXECUTION=true
      # Notifications
      - NOTIFICATIONS_ENABLED=${NOTIFICATIONS_ENABLED:-false}
      - EMAIL_NOTIFICATIONS_ENABLED=${EMAIL_NOTIFICATIONS_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@traceiq.io}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - qip_network

  # --------------------------------------------------------------------------
  # Celery Workers
  # --------------------------------------------------------------------------
  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: always
    command: celery -A app.core.celery_app worker --loglevel=info -Q main-queue -c 4
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - USE_DISTRIBUTED_EXECUTION=true
      - EMAIL_NOTIFICATIONS_ENABLED=${EMAIL_NOTIFICATIONS_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@traceiq.io}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - qip_network

  celery_aggregator:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: always
    command: celery -A app.core.celery_app worker --loglevel=info -Q aggregator-queue -c 2
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - qip_network

  celery_beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: always
    command: celery -A app.core.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - redis
    networks:
      - qip_network

  # --------------------------------------------------------------------------
  # Execution Workers (Scalable)
  # --------------------------------------------------------------------------
  execution-worker:
    build:
      context: ../execution-engine
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    command: npm run worker
    deploy:
      replicas: ${WORKER_REPLICAS:-3}
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_JOBS_STREAM=jobs:pending
      - REDIS_RESULTS_STREAM=jobs:results
      - REDIS_CONSUMER_GROUP=execution-workers
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET_NAME=test-artifacts
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEFAULT_TIMEOUT=30000
      - WORKER_IDLE_TIMEOUT=60000
      - MAX_JOBS_BEFORE_RESTART=50
      - ARTIFACTS_DIR=/tmp/artifacts
    depends_on:
      - redis
      - minio
    networks:
      - qip_network
    shm_size: '1gb'

volumes:
  postgres_data:
  redis_data:
  minio_data:


networks:
  qip_network:
    driver: bridge
